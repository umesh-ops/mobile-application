<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Show and Toggle Value</title>
</head>
<body>

<h2>JavaScript Calculation</h2>

<button onclick="toggleValue()">Show Value</button>

<p id="result" style="display:none;"></p>

<script>
    function toggleValue() {
        let result = document.getElementById("result");

        let a = 5;
        let b = 6;
        let c = a + b;

        if (result.style.display === "none") {
            result.innerHTML =
                "a = " + a + "<br>" +
                "b = " + b + "<br>" +
                "c = a + b = " + c;

            result.style.display = "block";
        } else {
            result.style.display = "none";
        }
    }
</script>

</body>
</html>
